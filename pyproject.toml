[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "docpilot-rag"
version = "0.1.0"
description = "A local knowledge-base assistant with FastAPI, Milvus and DashScope adapters"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DocPilot contributors" }]
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.29,<1",
  "pydantic>=2.6,<3",
  "python-dotenv>=1.0,<2",
  "python-multipart>=0.0.9,<1",
  "pypdf>=4.2,<7",
  "python-docx>=1.1,<2",
]

[project.optional-dependencies]
production = [
  "dashscope>=1.20,<2",
  "pymilvus>=2.4,<3",
]
langchain = [
  "langchain-core>=0.2,<2",
  "langchain-text-splitters>=0.2,<2",
]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8.2,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.5,<1",
]

[project.scripts]
docpilot = "docpilot.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docpilot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

